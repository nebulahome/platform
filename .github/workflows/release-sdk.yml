# Publishes @nebulahome/package-sdk on npm (PACKAGES_DOCS.md 10 and 11, .changeset/README.md).
#
# A version of the SDK is published only together with a platform release that implements it, so
# this runs on main - the release branch - after the platform's release is merged there, and by
# hand. While changesets are pending, changesets/action opens the pull request that versions the
# SDK; once that is merged, the next run publishes the version that is not on npm yet: under the
# `rc` dist-tag while the SDK is in prerelease mode, `latest` after.
#
# Publishing uses npm's trusted publishing - this workflow, on this repository, is the SDK's
# trusted publisher on npmjs.com - so no token is stored, and every version carries provenance.
#
# @nebulahome/integration-sdk is not released here: it is in `.changeset/config.json`'s `ignore`,
# and `release-integration-sdk.yml` releases it from a tag.
name: release-sdk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-sdk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships 10.
      - name: Update npm
        run: npm install --global npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build --filter=@nebulahome/package-sdk

      - name: Gates
        run: pnpm turbo typecheck lint test --filter=@nebulahome/package-sdk

      - name: Public API
        run: pnpm --filter @nebulahome/package-sdk api:check

      - name: Tarball
        run: pnpm --filter @nebulahome/package-sdk check:package

      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: 'chore(package-sdk): version the package sdk'
          commit: 'chore(package-sdk): version the package sdk'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
