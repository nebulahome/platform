# NebulaHome on a machine of its own, from the published image - no build, no development stack.
#
#   cp .env.example .env        then change what you need (all optional)
#   docker compose pull
#   docker compose up -d --wait
#
# The page is then on http://<machine>:8080 and https://<machine>:8443 (a self-signed certificate
# made on the first start); the first visit creates the owner.
#
# One container is the whole platform: PostgreSQL with TimescaleDB, NATS and every service run
# inside it, supervised by s6 (../../Dockerfile), each in a volume of its own below. There is no
# database or bus container to add. The only containers beside it are the ones integrations need
# (zigbee2mqtt), which the platform starts itself through Docker's socket.
#
# The network: the host's own. The hub hears the LAN there - mDNS, Govee's scan, Shelly's and
# Bambu Lab's announcements, all multicast - and finds devices on its own. Nothing is published:
# the page is on the host's ports 8080 and 8443, and the house's MQTT broker (the hub's own)
# on 1883, for the devices on the network, with a username each. PostgreSQL (5433), NATS (4223,
# monitor 8223) and api (4100) listen on loopback only, with passwords, on ports that stay out of
# the way of anything else the host runs. The containers integrations run go on the host's network
# too, and reach the broker on 127.0.0.1.
#
# A Linux server only: Docker Desktop's host network is its virtual machine's, which reaches no
# device of the LAN. There, and wherever the host's network is not wanted, docker-compose.bridge.yml
# puts the platform on a bridge of its own instead, with discovery off (see README.md).

name: nebulahome

services:
  nebulahome:
    image: ${NEBULA_IMAGE:-nebulahome/platform}:${NEBULA_IMAGE_TAG:-latest}
    # Every container of this file is the platform's: the Containers page shows it as the system,
    # never stops or removes it, and makes no device of it.
    labels:
      io.nebulahome.platform: 'true'
    network_mode: host
    restart: unless-stopped
    # Longer than the services' own 10 s shutdown timeout, and PostgreSQL's after them.
    stop_grace_period: 45s
    env_file:
      - path: .env
        required: false
    environment:
      HUB_DISCOVERY_ENABLED: 'true'
      # The network the platform makes for the containers the owner installs on a bridge. Never
      # docker-compose.bridge.yml's `nebulahome-net`: Compose refuses to take over a network it
      # did not create, so switching to the bridge later would fail.
      SUPERVISOR_NETWORK: nebulahome
      TZ: ${TZ:-UTC}
    volumes:
      # The data directory: the integrations, the keys, the certificates, the backups, and the
      # data of the containers integrations run (the Zigbee network's keys among them). A named
      # volume by default; set NEBULA_DATA_PATH to a folder of this machine to keep it there
      # instead, where it is easy to copy.
      - ${NEBULA_DATA_PATH:-nebula-data}:/data
      - nebula-postgres:/var/lib/postgresql/data
      - nebula-nats:/var/lib/nats
      # Docker's socket, for the supervisor: the Containers page, and the containers integrations
      # need (zigbee2mqtt). It is root on this machine - only the supervisor, running as root,
      # holds it. Remove the line to keep Docker out of reach; the page then says so.
      - /var/run/docker.sock:/var/run/docker.sock
      # A disk of this machine for the backups: mount it here and add it as a local location.
      # - /mnt/backups:/mnt/backups
      # The machine's devices, for the Serial broker and the Thread broker's radio: the USB serial
      # ports, and /dev/serial/by-id with the names that stay the same across reboots, as they are
      # plugged in and out. A port a container uses (zigbee2mqtt's coordinator) is shown as its.
      - /dev:/dev
      # The system's D-Bus, for the Bluetooth broker and Matter's Bluetooth pairing: both go
      # through BlueZ, which keeps the adapter. Needs a D-Bus policy that lets uid 1000 talk to
      # org.bluez (README.md).
      - /run/dbus:/run/dbus:ro
    # What the mounted /dev may open: USB serial ports (ttyUSB, 188) and USB modems (ttyACM, 166),
    # for the Serial broker and the Thread radio, and the tunnel device (10:200), for the Thread
    # border router's wpan0.
    device_cgroup_rules:
      - 'c 188:* rmw'
      - 'c 166:* rmw'
      - 'c 10:200 rwm'
    # The Thread border router's network interface, wpan0.
    devices:
      - /dev/net/tun
    # The backups' SMB and NFS locations are mounted from inside the container. NET_ADMIN is the
    # Thread border router's: it brings wpan0 up and routes between it and the LAN.
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
      - NET_ADMIN
    security_opt:
      - apparmor:unconfined
    healthcheck:
      # The image's own check - proxy's /healthz - with more time on the first start, when the
      # keys are made and the database is created and migrated.
      start_period: 180s

volumes:
  nebula-data:
  nebula-postgres:
  nebula-nats:
