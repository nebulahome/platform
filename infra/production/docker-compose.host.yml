# On a Linux server: the platform on the host's own network, where the hub hears the LAN - mDNS,
# Govee's scan, Shelly's and Bambu Lab's announcements - and finds devices on its own.
#
#   docker compose -f docker-compose.yml -f docker-compose.host.yml up -d --wait
#
# Nothing is published: the page is on the host's ports 8080 and 8443 directly. PostgreSQL (5433),
# NATS (4223, monitor 8223), api (4100) and the MQTT broker (1884) listen on loopback only, with
# passwords, on ports that stay out of the way of anything else the host runs. The containers
# integrations run go on the host's network too, and reach the broker on 127.0.0.1.
#
# Not on Docker Desktop: its host network is its virtual machine's, which reaches no device of
# the LAN. Needs Compose 2.24 or later, for !reset.

services:
  nebulahome:
    network_mode: host
    networks: !reset {}
    ports: !reset []
    hostname: !reset null
    environment:
      NEBULA_NETWORK: host
      HUB_DISCOVERY_ENABLED: 'true'
      # The supervisor's own network, which it makes itself: never the one the bridge setup
      # declares, which Compose would then refuse to take back.
      SUPERVISOR_NETWORK: nebulahome
