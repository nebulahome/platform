# NebulaHome's one compose file.
#
#   pnpm docker:up     the whole platform in one container (../Dockerfile): http://localhost:8080
#   pnpm infra:up      only PostgreSQL and NATS, for the services run natively (pnpm dev) - the
#                      MQTT broker is the `mqtt` package, which pnpm dev runs with them
#
# Settings are in infra/.env, optional (see .env.example beside this file): read both to fill in
# this file and as the container's environment.
#
# The platform's network is a bridge by default, with the page's ports published: that works
# everywhere, Docker Desktop included. A bridge carries no multicast, so the hub cannot hear devices
# announce themselves there and discovery is off: devices are added by address. On a Linux server,
# NEBULA_NETWORK=host puts the container on the host's network instead, where discovery works and
# no port needs publishing (ARCHITECTURE.md 14). Docker Desktop's "host" is its own virtual
# machine's network, which reaches no device on the LAN: keep the bridge there.

name: nebulahome

services:
  nebulahome:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    # Docker Hub's name for the platform, so the containers page names it and asks Docker Hub
    # whether a newer one is out. `pnpm docker:push` publishes what was built here under it.
    image: nebulahome/platform:${NEBULA_IMAGE_TAG:-latest}
    network_mode: ${NEBULA_NETWORK:-bridge}
    # Every service of this file is the platform's: the containers page shows them as the system,
    # never stops or removes them, and makes no device of them.
    labels:
      io.nebulahome.platform: 'true'
    # Ignored on the host's network, where the page is on the host's own ports.
    ports:
      - '${NEBULA_HTTP_PORT:-8080}:8080'
      - '${NEBULA_HTTPS_PORT:-8443}:8443'
      # The house's MQTT broker, for the devices on the network.
      - '${NEBULA_MQTT_PORT:-1883}:1883'
    restart: unless-stopped
    # Longer than the services' own 10 s shutdown timeout, and PostgreSQL's after them.
    stop_grace_period: 45s
    env_file:
      - path: .env
        required: false
    environment:
      HUB_DISCOVERY_ENABLED: ${HUB_DISCOVERY_ENABLED:-false}
    volumes:
      - nebula-data:/data
      - nebula-postgres:/var/lib/postgresql/data
      - nebula-nats:/var/lib/nats
      # Docker's socket, for the supervisor: the Containers page, and the containers integrations
      # need (zigbee2mqtt). It is root on this machine - only the supervisor, running as root,
      # holds it. Remove the line to keep Docker out of reach; the page then says so.
      - /var/run/docker.sock:/var/run/docker.sock
      # A disk of the host for the backups: mount it here and add it as a local location.
      # - /mnt/backups:/mnt/backups
    # The backups' SMB and NFS locations are mounted from inside the container.
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined

  # What `pnpm dev` runs against: the services themselves run on the machine, so a reload takes a
  # second, a debugger attaches, and the hub is on the LAN. Started only by name (pnpm infra:up).

  postgres:
    profiles: [dev]
    # TimescaleDB rather than plain postgres: the history schema is built on hypertables and
    # continuous aggregates. Pinned to the tag the image is built on: a backup is restored only
    # into the TimescaleDB version that made it.
    image: timescale/timescaledb:2.29.2-pg16
    labels:
      io.nebulahome.platform: 'true'
    restart: unless-stopped
    environment:
      POSTGRES_USER: nebula
      POSTGRES_PASSWORD: nebula
      POSTGRES_DB: nebula
    ports:
      - '5432:5432'
    volumes:
      - dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nebula -d nebula']
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    profiles: [dev]
    image: nats:2.14.6-alpine
    labels:
      io.nebulahome.platform: 'true'
    restart: unless-stopped
    # -js enables JetStream, which the telemetry stream needs to survive a core restart.
    command: ['-js', '-m', '8222']
    ports:
      - '4222:4222'
      - '8222:8222'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8222/healthz']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nebula-data:
  nebula-postgres:
  nebula-nats:
  dev-postgres:
