packages:
  - 'apps/*'
  - 'packages/*'

# The Matter controller's library brings matter.js's Bluetooth stack with it; the hub commissions
# over the network only and never loads it, so its native bindings are not built. The hub's serial
# ports go through `serialport`, whose binding is not built either: it ships prebuilds (musl x64
# and arm64 among them) that node-gyp-build loads at run time.
allowBuilds:
  '@serialport/bindings-cpp': false
  '@stoprocent/bleno': false
  '@stoprocent/bluetooth-hci-socket': false
  '@stoprocent/noble': false
  esbuild: true
  unrs-resolver: true
  usb: false

minimumReleaseAgeExclude:
  - publint@0.3.25

# esbuild ships a platform binary from its postinstall; vitest, tsx and vite are unusable
# without it. Every other build script stays blocked by default.
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
